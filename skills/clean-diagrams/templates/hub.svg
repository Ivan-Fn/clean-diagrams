<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" role="img" aria-label="One pipeline joins three sources into the views each team uses">
  <style>
    svg { --bg:#ffffff; --ink:#0e0e0e; --quiet:#484745; --line:#bbbaaf; --tint:#f3f2ee;
          --accent:#266dcc; --accent-soft:#e5edf9; --good:#169824; --good-soft:#e3f3e5;
          --bad:#c93537; --bad-soft:#f8e7e7; --warn:#a15c00; --warn-soft:#fbefd9;
          font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1f1e1d; --ink:#f2f1ec; --quiet:#b8b6ad; --line:#6b6962; --tint:#2a2927;
            --accent:#6ea6ee; --accent-soft:#1d2a3c; --good:#5cc06a; --good-soft:#1c3020;
            --bad:#f07373; --bad-soft:#3a2020; --warn:#e5a54b; --warn-soft:#382a14; }
    }
    .bg { fill: var(--bg); }
    .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .box { fill: none; stroke: var(--line); stroke-width: 1.25; }
    .box.tint { fill: var(--tint); }
    .box.accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .box.good { fill: var(--good-soft); stroke: var(--good); stroke-width: 2; }
    .box.bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 2; }
    .box.warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; }
    .name { font-size: 15px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .note { font-size: 13px; fill: var(--quiet); text-anchor: middle; }
    .label { font-size: 11.5px; fill: var(--quiet); }
    .label.strong { font-weight: 600; fill: var(--ink); }
    .label.bad { fill: var(--bad); } .label.good { fill: var(--good); } .label.accent { fill: var(--accent); }
    .label.bad.strong, .label.good.strong, .label.accent.strong { font-weight: 600; }
    .item { font-size: 13px; fill: var(--ink); text-anchor: middle; }
    rect.group { fill: none; stroke: var(--line); stroke-width: 1.25; }
    rect.group.dashed { stroke-dasharray: 6 5; }
    rect.group.tint { fill: var(--tint); stroke: none; }
    .group-name { font-size: 14px; font-weight: 600; fill: var(--quiet); }
    .group-name.accent { fill: var(--accent); }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.25; }
    .edge.accent { stroke: var(--accent); stroke-width: 2; }
    .edge.good { stroke: var(--good); stroke-width: 2; }
    .edge.bad { stroke: var(--bad); stroke-width: 2; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--line); } .head.accent { fill: var(--accent); }
    .head.good { fill: var(--good); } .head.bad { fill: var(--bad); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head accent" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head good" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head bad" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="760" height="308"/>
  <text class="title" x="24" y="34">One pipeline joins three sources into the views each team uses</text>
  <g class="node" id="git">
    <rect class="box" x="24" y="68" width="200" height="56" rx="8"/>
    <text class="name" x="124" y="92">Git repositories</text>
    <text class="note" x="124" y="110">commits, pull requests</text>
  </g>
  <g class="node" id="ci">
    <rect class="box" x="24" y="148" width="200" height="56" rx="8"/>
    <text class="name" x="124" y="172">CI system</text>
    <text class="note" x="124" y="190">builds, test results</text>
  </g>
  <g class="node" id="incidents">
    <rect class="box" x="24" y="228" width="200" height="56" rx="8"/>
    <text class="name" x="124" y="252">Incident tracker</text>
    <text class="note" x="124" y="270">pages, postmortems</text>
  </g>
  <g class="node" id="metrics">
    <rect class="box accent" x="280" y="124" width="200" height="104" rx="8"/>
    <text class="name" x="380" y="148">Delivery metrics</text>
    <text class="note" x="380" y="166">joins each change to its</text>
    <text class="note" x="380" y="182">builds and incidents, then</text>
    <text class="note" x="380" y="198">computes lead time and</text>
    <text class="note" x="380" y="214">failure rate</text>
  </g>
  <g class="node" id="dashboard">
    <rect class="box" x="536" y="72" width="200" height="48" rx="8"/>
    <text class="name" x="636" y="101">Team dashboard</text>
  </g>
  <g class="node" id="report">
    <rect class="box" x="536" y="152" width="200" height="48" rx="8"/>
    <text class="name" x="636" y="181">Weekly report</text>
  </g>
  <g class="node" id="gate">
    <rect class="box" x="536" y="232" width="200" height="48" rx="8"/>
    <text class="name" x="636" y="261">Release gate</text>
  </g>
  <g class="edges">
    <path class="edge" id="e-git" data-from="git" data-to="metrics" d="M224 96H252V150H280" marker-end="url(#arrow)"/>
    <path class="edge" id="e-ci" data-from="ci" data-to="metrics" d="M224 176H280" marker-end="url(#arrow)"/>
    <path class="edge" id="e-incidents" data-from="incidents" data-to="metrics" d="M224 256H252V202H280" marker-end="url(#arrow)"/>
    <path class="edge" id="e-dashboard" data-from="metrics" data-to="dashboard" d="M480 176H508V96H536" marker-end="url(#arrow)"/>
    <path class="edge" id="e-report" data-from="metrics" data-to="report" d="M480 176H536" marker-end="url(#arrow)"/>
    <path class="edge" id="e-gate" data-from="metrics" data-to="gate" d="M480 176H508V256H536" marker-end="url(#arrow)"/>
  </g>
</svg>
