<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="Trade data leaves the data centre only through the gateway">
  <style>
    svg { --bg:#ffffff; --ink:#0e0e0e; --quiet:#484745; --line:#bbbaaf; --tint:#f3f2ee;
          --accent:#266dcc; --accent-soft:#e5edf9; --good:#169824; --good-soft:#e3f3e5;
          --bad:#c93537; --bad-soft:#f8e7e7; --warn:#a15c00; --warn-soft:#fbefd9;
          font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1f1e1d; --ink:#f2f1ec; --quiet:#b8b6ad; --line:#6b6962; --tint:#2a2927;
            --accent:#6ea6ee; --accent-soft:#1d2a3c; --good:#5cc06a; --good-soft:#1c3020;
            --bad:#f07373; --bad-soft:#3a2020; --warn:#e5a54b; --warn-soft:#382a14; }
    }
    .bg { fill: var(--bg); }
    .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .box { fill: none; stroke: var(--line); stroke-width: 1.25; }
    .box.tint { fill: var(--tint); }
    .box.accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .box.good { fill: var(--good-soft); stroke: var(--good); stroke-width: 2; }
    .box.bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 2; }
    .box.warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; }
    .name { font-size: 15px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .note { font-size: 13px; fill: var(--quiet); text-anchor: middle; }
    .name.start, .note.start, .group-name.start { text-anchor: start; }
    .label { font-size: 11.5px; fill: var(--quiet); }
    .label.strong { font-weight: 600; fill: var(--ink); }
    .label.bad { fill: var(--bad); } .label.good { fill: var(--good); } .label.accent { fill: var(--accent); }
    .label.bad.strong, .label.good.strong, .label.accent.strong { font-weight: 600; }
    .item { font-size: 13px; fill: var(--ink); text-anchor: middle; }
    rect.group { fill: none; stroke: var(--line); stroke-width: 1.25; }
    rect.group.dashed { stroke-dasharray: 6 5; }
    rect.group.tint { fill: var(--tint); stroke: none; }
    .group-name { font-size: 14px; font-weight: 600; fill: var(--quiet); }
    .group-name.accent { fill: var(--accent); }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.25; }
    .edge.accent { stroke: var(--accent); stroke-width: 2; }
    .edge.good { stroke: var(--good); stroke-width: 2; }
    .edge.bad { stroke: var(--bad); stroke-width: 2; }
    .edge.dashed { stroke-dasharray: 5 4; }
    path.lifeline { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 3 4; }
    use.icon { color: var(--quiet); } use.icon.ink { color: var(--ink); } use.icon.accent { color: var(--accent); }
    use.icon.good { color: var(--good); } use.icon.bad { color: var(--bad); } use.icon.warn { color: var(--warn); }
    .head { fill: var(--line); } .head.accent { fill: var(--accent); }
    .head.good { fill: var(--good); } .head.bad { fill: var(--bad); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head accent" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head good" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head bad" d="M0 0L10 5L0 10z"/></marker>
      <symbol id="icon-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M12 6h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 6h.01"/><path d="M9 22v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><rect x="4" y="2" width="16" height="20" rx="2"/></symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="icon-app-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
    <symbol id="icon-square-function" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M9 17c2 0 2.8-1 2.8-2.8V10c0-2 1-3.3 3.2-3"/><path d="M9 11.2h5.7"/></symbol>
    <symbol id="icon-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="icon-warehouse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"/><path d="M6 13h12"/><path d="M6 17h12"/></symbol>
    <symbol id="icon-layout-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
  </defs>
  <rect class="bg" width="760" height="296"/>

  <text class="title" x="24" y="34">Trade data leaves the data centre only through the gateway</text>

  <!-- one container per place the work runs: an icon and a name in its top-left corner -->
  <g class="group" id="onprem">
    <rect class="group" x="24" y="56" width="216" height="216" rx="8"/>
    <use class="icon" href="#icon-building" x="40" y="70" width="16" height="16"/>
    <text class="group-name start" x="64" y="84">On-premises</text>
  </g>
  <g class="group" id="aws">
    <rect class="group" x="272" y="56" width="216" height="216" rx="8"/>
    <use class="icon" href="#icon-cloud" x="288" y="70" width="16" height="16"/>
    <text class="group-name start" x="312" y="84">AWS account</text>
  </g>
  <g class="group" id="gcp">
    <rect class="group" x="520" y="56" width="216" height="216" rx="8"/>
    <use class="icon" href="#icon-cloud" x="536" y="70" width="16" height="16"/>
    <text class="group-name start" x="560" y="84">GCP project</text>
  </g>

  <!-- boxes: an 18-unit icon 14 in from the left, vertically centred; text left-aligned 42 in -->
  <g class="node" id="app">
    <rect class="box" x="40" y="104" width="184" height="56" rx="8"/>
    <use class="icon" href="#icon-app-window" x="54" y="123" width="18" height="18"/>
    <text class="name start" x="82" y="128">Trading app</text>
    <text class="note start" x="82" y="146">order entry</text>
  </g>
  <g class="node" id="gateway">
    <rect class="box accent" x="40" y="200" width="184" height="56" rx="8"/>
    <use class="icon accent" href="#icon-shield" x="54" y="219" width="18" height="18"/>
    <text class="name start" x="82" y="224">Gateway</text>
    <text class="note start" x="82" y="242">the only way out</text>
  </g>
  <g class="node" id="ingest">
    <rect class="box" x="288" y="200" width="184" height="56" rx="8"/>
    <use class="icon" href="#icon-square-function" x="302" y="219" width="18" height="18"/>
    <text class="name start" x="330" y="224">Ingest function</text>
    <text class="note start" x="330" y="242">validates trades</text>
  </g>
  <g class="node" id="queue">
    <rect class="box" x="288" y="104" width="184" height="56" rx="8"/>
    <use class="icon" href="#icon-inbox" x="302" y="123" width="18" height="18"/>
    <text class="name start" x="330" y="128">Event queue</text>
    <text class="note start" x="330" y="146">one topic per desk</text>
  </g>
  <g class="node" id="warehouse">
    <rect class="box" x="536" y="104" width="184" height="56" rx="8"/>
    <use class="icon" href="#icon-warehouse" x="550" y="123" width="18" height="18"/>
    <text class="name start" x="578" y="128">Data warehouse</text>
    <text class="note start" x="578" y="146">analytics</text>
  </g>
  <g class="node" id="dash">
    <rect class="box" x="536" y="200" width="184" height="56" rx="8"/>
    <use class="icon" href="#icon-layout-dashboard" x="550" y="219" width="18" height="18"/>
    <text class="name start" x="578" y="224">Dashboards</text>
    <text class="note start" x="578" y="242">risk reports</text>
  </g>
  <g class="edges">
    <path class="edge" id="e-app-gateway" data-from="app" data-to="gateway" d="M132 160V200" marker-end="url(#arrow)"/>
    <path class="edge accent" id="e-gateway-ingest" data-from="gateway" data-to="ingest" d="M224 228H288" marker-end="url(#arrow-accent)"/>
    <path class="edge" id="e-ingest-queue" data-from="ingest" data-to="queue" d="M380 200V160" marker-end="url(#arrow)"/>
    <path class="edge" id="e-queue-warehouse" data-from="queue" data-to="warehouse" d="M472 132H536" marker-end="url(#arrow)"/>
    <path class="edge" id="e-warehouse-dash" data-from="warehouse" data-to="dash" d="M628 160V200" marker-end="url(#arrow)"/>
  </g>
  <text class="label" x="140" y="184">trades</text>
  <text class="label accent" x="256" y="220" text-anchor="middle">mTLS</text>
  <text class="label" x="388" y="184">publish</text>
  <text class="label" x="504" y="124" text-anchor="middle">copy</text>
  <text class="label" x="636" y="184">query</text>
</svg>
